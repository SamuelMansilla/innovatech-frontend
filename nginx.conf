server {
    listen 80;
    server_name localhost;

    # Servir la aplicación estática de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 🌟 PROXY INVERSO: Desvía las peticiones de Ventas al puerto 8081 del Backend
    location /api/v1/ventas {
        proxy_pass http://10.0.138.187:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🌟 PROXY INVERSO: Desvía las peticiones de Despachos al puerto 8080 del Backend
    location /api/v1/despachos {
        proxy_pass http://10.0.138.187:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}