name: Pipeline Pipeline CI/CD Backend Ventas

on:
  push:
    branches:
      - deploy 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v3

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: petardorecursos/back-ventas:latest

  deploy-to-private-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 4. Desplegar usando EC2-Frontend como puente (Bastion)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRIVATE_IP }}     # IP Interna de tu Backend (10.0...)
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_PUBLIC_IP }} # IP Pública de tu Frontend (El puente)
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            docker compose pull back-ventas
            docker compose up -d --remove-orphans back-ventas