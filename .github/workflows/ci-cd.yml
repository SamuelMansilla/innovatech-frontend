name: Pipeline CI/CD Frontend

# REQUISITO DEL ENCARGO: El pipeline solo se activa en la rama 'deploy'
on:
  push:
    branches:
      - deploy 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v3

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: petardorecursos/front-despacho:latest