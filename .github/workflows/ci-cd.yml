name: CI/CD Frontend

on:
  push:
    branches:
      - deploy # Se ejecuta al mandar cambios a la rama deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v3

      # 2. Configurar credenciales de AWS Academy
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 3. Autenticarse en Amazon ECR
      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Construir y subir la imagen a ECR
      - name: Construir, etiquetar y subir imagen a Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: innovatech-frontend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 5. Despliegue directo a la máquina pública usando la IP Elástica
      - name: Desplegar en EC2 Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "35.171.177.194"              # 🔥 Tu IP Elástica Fija (Directo, sin proxy)
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            # Autenticar Docker con tu ID de cuenta AWS
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 536888590851.dkr.ecr.us-east-1.amazonaws.com
            # Descargar la nueva versión del Frontend y levantarla
            docker compose pull frontend
            docker compose up -d --remove-orphans frontend